name: PaperizeFold Build

# Every push to master builds a signed APK and publishes it as a GitHub Release,
# so Obtainium can install and update it. You can also run it by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (off = build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fold-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Uses the fork's own signing key (signing/paperizefold.jks). If you later add
      # repository secrets SIGNING_KEYSTORE_BASE64 / SIGNING_KEY_ALIAS / SIGNING_STORE_PASSWORD /
      # SIGNING_KEY_PASSWORD, those are used instead.
      - name: Select signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks"
              echo "SIGNING_KEY_ALIAS=$SECRET_ALIAS"
              echo "SIGNING_STORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            {
              echo "SIGNING_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/paperizefold.jks"
              echo "SIGNING_KEY_ALIAS=paperizefold"
              echo "SIGNING_STORE_PASSWORD=paperizefold"
              echo "SIGNING_KEY_PASSWORD=paperizefold"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK and run unit tests
        shell: bash
        env:
          FOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease test --continue 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Turn compiler errors and test failures into annotations, so they can be read from the
      # run summary (and the API) without downloading logs.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re

          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()

          def emit(title, chunk):
              message = "\n".join(chunk)[:30000]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")

          kotlin = [l for l in lines if re.match(r"^(e|w): ", l) and l.startswith("e: ")]
          for i in range(0, min(len(kotlin), 125), 25):
              emit(f"Kotlin errors {i + 1}+", kotlin[i:i + 25])

          tests = []
          for i, l in enumerate(lines):
              if l.rstrip().endswith(" FAILED") and ">" in l:
                  tests.extend(lines[i:i + 6])
          if tests:
              emit("Test failures", tests[:120])

          wrong = []
          capture = False
          for l in lines:
              if l.startswith("* What went wrong"):
                  capture = True
              elif l.startswith("* Try") or l.startswith("* Get more help"):
                  capture = False
              if capture:
                  wrong.append(l)
          if wrong:
              emit("What went wrong", wrong[:150])

          emit("Build log tail", lines[-60:])
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Name APK
        id: apk
        run: |
          NAME="PaperizeFold-4.2.0-fold.${{ github.run_number }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        if: github.event_name == 'workflow_dispatch' && !inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fold-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" \
            --title "PaperizeFold build ${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}."
